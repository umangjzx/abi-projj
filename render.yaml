# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Deploys the Express API as a free Web Service. The database is an EXTERNAL
# managed Postgres (Neon free tier) rather than Render's own free Postgres,
# which expires 30 days after creation.
#
# Usage:
#   1. Create a free Postgres at https://neon.tech and copy its connection
#      string (use the direct / unpooled one).
#   2. Render dashboard -> "New +" -> "Blueprint" -> point at this repo.
#   3. In the API service's Environment tab, set DATABASE_URL to the Neon
#      string with `?sslmode=require` appended.
#   4. The start command runs `prisma migrate deploy` on every boot, so the
#      schema is created automatically. Load demo data once with
#      `npm run db:seed` via the Render shell (it wipes existing data, so it
#      is never run automatically).
#
# CORS_ORIGINS and CLIENT_URL default to localhost -- set them to your Vercel
# domain in the Render dashboard once the frontend is deployed.

services:
  - type: web
    name: thuthi-dairy-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # --include=dev is required: NODE_ENV=production (set below) makes plain
    # `npm install` skip devDependencies, but tsc and the prisma CLI -- both
    # needed by `npm run build` -- live there. Without this flag the build
    # fails with "tsc: not found" / exit code 2.
    buildCommand: npm install --include=dev && npm run build
    # Applies any pending migrations on every deploy/restart before the app
    # starts -- safe to run repeatedly (it only applies new migrations) and
    # means a fresh Blueprint deploy needs no manual migration step. Seeding
    # is deliberately NOT run here: `db:seed` wipes existing data, which must
    # never happen automatically on a restart of a live deployment.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      # Set manually in the Render dashboard (Environment tab). Points at an
      # external managed Postgres (Neon) so it does not expire like Render's
      # free tier. Include ?sslmode=require in the value.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: OTP_TTL_MINUTES
        value: 10
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false" # flip to "true" once SMTP is configured below
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: MAIL_FROM
        value: "Thuthi Dairy <no-reply@thuthidairy.com>"
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: CLOUDINARY_FOLDER
        value: thuthi-dairy
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX
        value: 600
      - key: AUTH_RATE_LIMIT_MAX
        value: 25
      - key: DELIVERY_FEE
        value: 25
      - key: FREE_DELIVERY_THRESHOLD
        value: 499
      - key: TAX_PERCENT
        value: 5
      - key: LOW_STOCK_THRESHOLD
        value: 15
      # Deployment-specific -- set in the Render dashboard to the deployed
      # frontend origin (e.g. https://abi-projj.vercel.app). `sync: false`
      # keeps a blueprint re-sync from clobbering them back to localhost.
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false

# No `databases:` block: the database is an external managed Postgres (Neon),
# configured via the DATABASE_URL env var above. Render's free managed Postgres
# expires 30 days after creation, which is why it is not used here.
